spring.datasource.url=jdbc:h2:mem:carddemo
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
carddemo.import.usrsec.enabled=true
carddemo.project-root=.
# Batch jobs run only when launched by name (spring.batch.job.name), as their
# JCL steps would; never at application startup.
spring.batch.job.enabled=false
